name: Antigravity AI Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  backend-test:
    name: Backend API & Intelligence Layer Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Verify FastAPI Contract & Modules
        env:
          ENVIRONMENT: test
          GROQ_API_KEY: mock_key
          PINECONE_API_KEY: mock_key
        run: |
          python scratch/test_frontend_api_contract.py

  frontend-build:
    name: Next.js 15 Cyber UI Compilation & Static Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Standalone Production Bundle
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

  docker-verify:
    name: Containerization Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Backend Image
        run: |
          docker build -f Dockerfile -t antigravity-backend:test .

      - name: Build Next.js Frontend Image
        run: |
          docker build -f frontend/Dockerfile -t antigravity-frontend:test ./frontend

      - name: Verify Docker Compose Configuration
        run: |
          docker compose config
