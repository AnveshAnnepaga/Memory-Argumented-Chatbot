# File: app/ingestion/sources.yaml
# Trusted Knowledge Sources (`Milestone 8 Source Registry`)

programming:
  - name: Python Documentation
    url: https://docs.python.org/3/
    trust: tier1
    priority: high
    allowed_paths: ["/3/tutorial/", "/3/library/"]
    excluded_paths: ["/3/whatsnew/"]

  - name: FastAPI Documentation
    url: https://fastapi.tiangolo.com/
    trust: tier1
    priority: high
    allowed_paths: ["/tutorial/", "/advanced/"]
    excluded_paths: ["/release-notes/"]

  - name: LangChain Documentation
    url: https://python.langchain.com/docs/
    trust: tier1
    priority: high
    allowed_paths: ["/docs/"]

  - name: LangGraph Documentation
    url: https://langchain-ai.github.io/langgraph/
    trust: tier1
    priority: high

  - name: SQLAlchemy Documentation
