# File: app/ingestion/sources.yaml
# Trusted Knowledge Sources (`Milestone 8 Source Registry`)
# Each source can specify per-source crawl limits and sitemap preference.

programming:
  - name: Python Documentation
    url: https://docs.python.org/3/
    trust: tier1
    priority: high
    allowed_paths: ["/3/tutorial/", "/3/library/", "/3/reference/", "/3/howto/"]
    excluded_paths: ["/3/whatsnew/", "/3/distutils/"]
    max_pages: 200
    max_depth: 5
    use_sitemap: true

