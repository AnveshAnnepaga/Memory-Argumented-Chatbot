version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity_backend
    restart: always
    env_file:
      - path: .env
        required: true
    environment:
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    networks:
      - antigravity_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antigravity_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - antigravity_net

  nginx:
    image: nginx:alpine
    container_name: antigravity_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - antigravity_net

networks:
  antigravity_net:
    driver: bridge