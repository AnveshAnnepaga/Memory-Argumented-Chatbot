version: '3.8'

services:
  # 1. FastAPI Backend Service (Reasoning Engine, RAG & LangGraph)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - POSTGRES_URL=postgresql://postgres:password@postgres:5432/antigravity_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - GROQ_API_KEY=${GROQ_API_KEY:-mock-key}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-mock-key}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    networks:
      - antigravity_net

  # 2. Next.js 15 Cyber Glassmorphism Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antigravity_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - antigravity_net

  # 3. NGINX Reverse Proxy & SSE Stream Buffer Manager
  nginx:
    image: nginx:alpine
    container_name: antigravity_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - antigravity_net

  # 4. PostgreSQL Database (Long-Term Memory & User Profiles)
  postgres:
    image: postgres:16-alpine
    container_name: antigravity_postgres
    restart: always
    environment:
      POSTGRES_DB: antigravity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d antigravity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antigravity_net

  # 5. Neo4j Knowledge Graph (GraphRAG Multi-Hop Entities)
  neo4j:
    image: neo4j:5.20.0-community
    container_name: antigravity_neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - antigravity_net

networks:
  antigravity_net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
